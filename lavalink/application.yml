server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false # handled by the youtube-source plugin instead
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    # 400ms (Lavalink's own default) is tight for a self-hosted setup —
    # any network jitter between here and Discord's voice servers shows up
    # as audible stutter/buffering. Bumped further after 1500ms still
    # showed some jitter — plenty of CPU/RAM headroom (confirmed <7% CPU
    # under load) to spend on a bigger buffer instead.
    bufferDurationMs: 3000
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

  plugins:
    - dependency: dev.lavalink.youtube:youtube-plugin:1.18.2
      repository: https://maven.lavalink.dev/releases
    - dependency: com.github.topi314.lavasrc:lavasrc-plugin:4.8.3
      repository: https://maven.lavalink.dev/releases

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      # TV is the ONLY client the plugin supports OAuth on (confirmed via
      # its own docs) — it has no search/metadata support at all, so it's
      # useless alone, but paired with the others below (which resolve
      # search/metadata fine but were failing at actual playback) it gives
      # Lavalink an authenticated fallback for the streaming step itself.
      - TV
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # YouTube's bot detection routinely fails every client with no auth at
    # all ("This video requires login" / "unavailable") — OAuth is the
    # plugin's own recommended fix. Enable via YOUTUBE_OAUTH_ENABLED=true;
    # on first boot (with no refreshToken set) Lavalink prints a one-time
    # device code + URL to its own logs (docker compose logs lavalink) —
    # visit it, authorize with a Google account (a burner, per the plugin's
    # own warning — it can flag/terminate the account), then copy the
    # refresh token Lavalink prints afterward into YOUTUBE_REFRESH_TOKEN so
    # it doesn't need to be redone on every restart.
    oauth:
      enabled: "${YOUTUBE_OAUTH_ENABLED:false}"
      refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    # Alternative/complementary to OAuth — only covers the WEB/WEBEMBEDDED
    # clients per the plugin's own docs, not a full fix on its own.
    pot:
      token: "${YOUTUBE_PO_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: false # enabled automatically once SPOTIFY_CLIENT_ID/SECRET are set (see Tier 2 setup)
      applemusic: false
      deezer: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
    applemusic:
      mediaAPIToken: "${APPLE_MUSIC_TOKEN}"
    deezer:
      masterDecryptionKey: "${DEEZER_KEY}"

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO # prints the OAuth device code + URL on first run
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 3
